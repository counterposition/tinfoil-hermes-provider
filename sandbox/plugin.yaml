name: tinfoil-sandbox
label: Tinfoil Container
kind: backend
version: 0.1.0
manifest_version: 2
author: Harish Kukreja
homepage: https://github.com/counterposition/tinfoil-hermes-provider/tree/main/sandbox
license: MIT
tags: [terminal, sandbox, confidential-computing, tinfoil]
description: >
  Tinfoil Container terminal backend for Hermes Agent: the terminal, file and
  code tools run inside your own container in an attested enclave, reached
  through the Tinfoil CLI's verified SSH tunnel. Select it with
  `terminal.backend: tinfoil` and name the container in
  `terminal.tinfoil_container`.
requires_hermes: ">=0.23.1"
provides_tools: []
provides_hooks: [pre_tool_call]
config_keys:
  - terminal.tinfoil_container
  - terminal.tinfoil_repo
  - terminal.tinfoil_user
  - terminal.tinfoil_ssh_port
  - terminal.tinfoil_identity_file
  - terminal.tinfoil_allow_debug
optional_env:
  - name: TINFOIL_API_KEY
    description: Tinfoil inference key; the enclave's SSH tunnel checks it
    url: https://dash.tinfoil.sh/
    secret: true
  - name: TINFOIL_CONTAINER
    description: Container name or enclave hostname, when terminal.tinfoil_container is unset
  - name: TINFOIL_CLI
    description: Path to the tinfoil CLI when it is not on PATH
